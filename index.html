
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Payroll Portal — Sign In</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            base: 'rgb(var(--c-base) / <alpha-value>)',
            panel: 'rgb(var(--c-panel) / <alpha-value>)',
            inset: 'rgb(var(--c-inset) / <alpha-value>)',
            line: 'rgb(var(--c-line) / <alpha-value>)',
            fg: 'rgb(var(--c-fg) / <alpha-value>)',
            'fg-soft': 'rgb(var(--c-fg-soft) / <alpha-value>)',
            muted: 'rgb(var(--c-muted) / <alpha-value>)',
            brand: 'rgb(var(--c-brand) / <alpha-value>)',
            success: 'rgb(var(--c-success) / <alpha-value>)',
            danger: 'rgb(var(--c-danger) / <alpha-value>)'
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="styles.css?v=6" />

  <style>
    :root {
      color-scheme: dark;
      --c-base: 2 6 23;
      --c-panel: 15 23 42;
      --c-inset: 2 6 23;
      --c-line: 30 41 59;
      --c-fg: 248 250 252;
      --c-fg-soft: 203 213 225;
      --c-muted: 148 163 184;
      --c-brand: 129 140 248;
      --c-success: 52 211 153;
      --c-danger: 251 113 133;
    }

    html.light {
      color-scheme: light;
      --c-base: 241 245 249;
      --c-panel: 255 255 255;
      --c-inset: 248 250 252;
      --c-line: 203 213 225;
      --c-fg: 15 23 42;
      --c-fg-soft: 51 65 85;
      --c-muted: 71 85 105;
      --c-brand: 79 70 229;
      --c-success: 5 150 105;
      --c-danger: 190 18 60;
    }

    html {
      background-color: rgb(var(--c-base));
      color: rgb(var(--c-fg));
    }

    [hidden] {
      display: none !important;
    }

    .form-error {
      color: rgb(var(--c-danger));
    }
  </style>

  <script>
    (() => {
      try {
        if (localStorage.getItem('payrollTheme') === 'light') {
          document.documentElement.classList.add('light');
        }
      } catch (_) {}
    })();
  </script>
</head>

<body class="min-h-screen bg-base text-fg font-sans antialiased flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

  <div class="pointer-events-none fixed -top-32 left-1/4 h-96 w-96 rounded-full bg-brand/10 blur-3xl"></div>
  <div class="pointer-events-none fixed -bottom-32 right-1/4 h-96 w-96 rounded-full bg-success/10 blur-3xl"></div>

  <button
    type="button"
    id="themeToggleBtn"
    aria-label="Toggle colour theme"
    class="btn btn-ghost !px-3 !py-2.5 fixed top-5 right-5 z-50 !text-[11px]"
  >
    <span id="themeModeText">Dark</span>
  </button>

  <main class="glass glow-brand relative z-10 w-full max-w-xl rounded-2xl border border-line p-7 sm:p-9 shadow-2xl space-y-7">

    <header class="text-center space-y-1.5">
      <h1 class="text-3xl font-bold tracking-tight text-fg">
        Payroll Portal
      </h1>

      <p id="portalSubtext" class="text-xs tracking-wide text-muted">
        Please sign in to access the system.
      </p>
    </header>

    <!-- LOGIN -->
    <form id="loginForm" class="space-y-5">

      <div>
        <label for="loginEmail" class="mb-2 block text-[11px] font-semibold uppercase tracking-wider text-fg-soft">
          Email Address
        </label>

        <input
          type="email"
          id="loginEmail"
          required
          autocomplete="username"
          placeholder="Enter your registered email"
          class="field"
        />
      </div>

      <div>
        <label for="passcode" class="mb-2 block text-[11px] font-semibold uppercase tracking-wider text-fg-soft">
          Password
        </label>

        <input
          type="password"
          id="passcode"
          required
          autocomplete="current-password"
          placeholder="Enter your password"
          class="field"
        />
      </div>

      <p
        id="loginError"
        role="alert"
        aria-live="polite"
        class="hidden rounded-lg border border-danger/40 bg-danger/10 px-3.5 py-2.5 text-xs font-semibold form-error"
      ></p>

      <button type="submit" id="loginBtn" class="btn btn-brand w-full">
        Sign In
      </button>

    </form>

    <!-- CATEGORY SELECTION -->
    <section id="categorySection" class="hidden space-y-6">

      <div class="flex items-center justify-between gap-4 rounded-xl border border-brand/30 bg-brand/5 p-4">

        <div class="min-w-0">
          <span class="block text-[10px] font-semibold uppercase tracking-wider text-muted">
            Authenticated as
          </span>

          <span
            id="authenticatedUserDisplay"
            class="block truncate text-xs font-bold text-brand"
          >
            —
          </span>
        </div>

        <button
          type="button"
          id="logoutBtn"
          class="shrink-0 text-[11px] font-bold uppercase tracking-wider text-danger"
        >
          Log Out
        </button>

      </div>

      <form id="categoryForm" class="space-y-5">

        <div>
          <label
            for="initialWorkerType"
            class="mb-2 block text-[11px] font-semibold uppercase tracking-wider text-fg-soft"
          >
            Worker Category
          </label>

          <select id="initialWorkerType" required class="field">
            <option value="">— Select Category —</option>
          </select>
        </div>

        <button type="submit" class="btn btn-brand w-full">
          Continue to Data Entry
        </button>

      </form>

    </section>

    <p id="loadingMessage" class="hidden text-center text-xs text-muted" aria-live="polite">
      Connecting securely...
    </p>

  </main>

  <div id="toastHost" aria-live="polite" aria-atomic="true"></div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      setPersistence,
      browserSessionPersistence
    } from
      "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    } from
      "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    /* ==========================================
       FIREBASE CONFIGURATION
       ========================================== */

    const firebaseConfig = {
      apiKey: "AIzaSyCID8H8Ba-82SOKDrJ5-7FfBpHanUyPgISs",
      authDomain: "payroll-tracker-55409.firebaseapp.com",
      projectId: "payroll-tracker-55409",
      storageBucket: "payroll-tracker-55409.firebasestorage.app",
      messagingSenderId: "336268687896",
      appId: "1:336268687896:web:666719cdb5ce72db27616d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    /* ==========================================
       DOM HELPERS
       ========================================== */

    const $ = (id) => document.getElementById(id);

    const loginForm = $('loginForm');
    const categorySection = $('categorySection');
    const categoryForm = $('categoryForm');
    const loginError = $('loginError');
    const loginBtn = $('loginBtn');
    const loadingMessage = $('loadingMessage');

    const SESSION_KEY = 'activePayrollUser';
    const THEME_KEY = 'payrollTheme';

    let activeUser = null;
    let activeProfile = null;
    let isSubmitting = false;

    /* ==========================================
       THEME
       ========================================== */

    function applyTheme(theme) {
      const light = theme === 'light';

      document.documentElement.classList.toggle('light', light);
      $('themeModeText').textContent = light ? 'Light' : 'Dark';
    }

    applyTheme(
      document.documentElement.classList.contains('light')
        ? 'light'
        : 'dark'
    );

    $('themeToggleBtn').addEventListener('click', () => {
      const next =
        document.documentElement.classList.contains('light')
          ? 'dark'
          : 'light';

      try {
        localStorage.setItem(THEME_KEY, next);
      } catch (_) {}

      applyTheme(next);
    });

    /* ==========================================
       ERROR DISPLAY
       ========================================== */

    function showError(message) {
      loginError.textContent = message;
      loginError.classList.remove('hidden');
    }

    function clearError() {
      loginError.textContent = '';
      loginError.classList.add('hidden');
    }

    /* ==========================================
       NAVIGATION
       ========================================== */

    function goToDashboard(type = '') {
      const params = new URLSearchParams();

      if (type) {
        params.set('type', type);
      }

      window.location.href =
        `payroll.html${params.toString() ? '?' + params.toString() : ''}`;
    }

    /* ==========================================
       LOAD USER ROLE
       ========================================== */

    async function loadUserProfile(firebaseUser) {
      const profileRef = doc(db, 'user_roles', firebaseUser.uid);
      const profileSnap = await getDoc(profileRef);

      if (!profileSnap.exists()) {
        throw new Error('NO_ROLE_PROFILE');
      }

      const profile = profileSnap.data();

      if (
        typeof profile.displayName !== 'string' ||
        !['owner', 'admin'].includes(profile.role)
      ) {
        throw new Error('INVALID_ROLE_PROFILE');
      }

      if (
        profile.role === 'admin' &&
        (!Array.isArray(profile.categories) || profile.categories.length === 0)
      ) {
        throw new Error('MISSING_CATEGORIES');
      }

      return profile;
    }

    /* ==========================================
       SHOW CATEGORY SELECTION
       ========================================== */

    function showCategoryStep(profile) {
      loginForm.classList.add('hidden');
      categorySection.classList.remove('hidden');

      $('authenticatedUserDisplay').textContent =
        `${profile.displayName} · ${profile.role}`;

      $('portalSubtext').textContent =
        'Select a worker category to start data entry.';

      const select = $('initialWorkerType');
      select.replaceChildren(
        new Option('— Select Category —', '', true, true)
      );

      select.firstElementChild.disabled = true;

      const allowedCategories =
        profile.role === 'owner'
          ? [
              'Admin GPS',
              'Finance GPS',
              'Finance HPZ',
              'Admin HPZ',
              'Team comm',
              'Sales HPZ',
              'Gudang',
              'Driver',
              'Mekanik HPZ',
              'Mekanik GPS',
              'Mekanik CCTV',
              'Helper'
            ]
          : profile.categories;

      allowedCategories.forEach((category) => {
        select.appendChild(new Option(category, category));
      });
    }

    /* ==========================================
       LOGIN
       ========================================== */

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      if (isSubmitting) return;

      clearError();

      const email = $('loginEmail').value.trim();
      const password = $('passcode').value;

      if (!email || !password) {
        showError('Please enter your email and password.');
        return;
      }

      isSubmitting = true;
      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing In...';
      loadingMessage.classList.remove('hidden');

      try {
        await setPersistence(auth, browserSessionPersistence);

        const credential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        activeUser = credential.user;

        activeProfile = await loadUserProfile(activeUser);

        sessionStorage.setItem(
          SESSION_KEY,
          activeProfile.displayName
        );

        if (activeProfile.role === 'owner') {
          goToDashboard();
          return;
        }

        showCategoryStep(activeProfile);

      } catch (error) {
        console.error('Login error:', error);

        await signOut(auth).catch(() => {});

        sessionStorage.removeItem(SESSION_KEY);

        if (
          error.code === 'auth/invalid-credential' ||
          error.code === 'auth/user-not-found' ||
          error.code === 'auth/wrong-password'
        ) {
          showError('Incorrect email or password.');
        } else if (error.code === 'auth/too-many-requests') {
          showError('Too many attempts. Please try again later.');
        } else if (
          error.message === 'NO_ROLE_PROFILE' ||
          error.message === 'INVALID_ROLE_PROFILE' ||
          error.message === 'MISSING_CATEGORIES'
        ) {
          showError('Your account is not configured correctly. Contact the owner.');
        } else {
          showError('Unable to sign in. Please check your connection and try again.');
        }

      } finally {
        isSubmitting = false;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
        loadingMessage.classList.add('hidden');
      }
    });

    /* ==========================================
       LOGOUT
       ========================================== */

    $('logoutBtn').addEventListener('click', async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error('Logout error:', error);
      }

      sessionStorage.removeItem(SESSION_KEY);

      activeUser = null;
      activeProfile = null;

      categorySection.classList.add('hidden');
      loginForm.classList.remove('hidden');

      loginForm.reset();
      clearError();

      $('portalSubtext').textContent =
        'Please sign in to access the system.';

      $('loginEmail').focus();
    });

    /* ==========================================
       CATEGORY ROUTING
       ========================================== */

    categoryForm.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!activeUser || !activeProfile) {
        showError('Your session has expired. Please sign in again.');
        return;
      }

      const category = $('initialWorkerType').value;

      if (!category) return;

      const allowed =
        activeProfile.role === 'owner' ||
        activeProfile.categories.includes(category);

      if (!allowed) {
        showError('You are not authorised to access this category.');
        return;
      }

      goToDashboard(category);
    });
  </script>

</body>
</html>
