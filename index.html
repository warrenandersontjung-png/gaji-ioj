<!-- index.html -->
<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payroll Portal - Authentication & Selection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6 flex items-center justify-center relative overflow-hidden antialiased">

  <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-0 right-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- THEME TOGGLE BUTTON -->
  <button type="button" id="themeToggleBtn" class="fixed top-6 right-6 p-2.5 rounded-xl glass-card border border-slate-800 text-slate-300 hover:text-white transition-all duration-200 z-50 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider">
    <svg id="themeIconSun" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    <svg id="themeIconMoon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    <span id="themeModeText">Dark</span>
  </button>

  <div class="max-w-xl w-full glass-card glow-indigo p-8 rounded-2xl border border-slate-800 shadow-2xl space-y-6 relative z-10">
    <div class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-white tracking-tight">Payroll Portal</h1>
      <p class="text-slate-400 text-xs tracking-wide" id="portalSubtext">Please authenticate to access the system.</p>
    </div>

    <!-- STEP 1: LOGIN FORM -->
    <form id="loginForm" class="space-y-5">
      <div>
        <label for="loginUser" class="block text-[11px] font-semibold text-slate-300 mb-2 uppercase tracking-wider">Select User</label>
        <select id="loginUser" required class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white text-xs focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all">
          <option value="" disabled selected>-- Select Your Name --</option>
          <option value="Christy">Christy (Admin - Finance HPZ)</option>
          <option value="Ayu">Ayu (Admin - Finance GPS)</option>
          <option value="Thusen">Mr. Thusen (Owner)</option>
        </select>
      </div>

      <div>
        <label for="passcode" class="block text-[11px] font-semibold text-slate-300 mb-2 uppercase tracking-wider">Passcode / PIN</label>
        <input type="password" id="passcode" required placeholder="Enter passcode" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white text-xs focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all">
      </div>

      <p id="loginError" class="text-rose-400 text-xs hidden">Invalid passcode. Please try again.</p>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-600/30 active:scale-[0.99]">
        Authenticate
      </button>
    </form>

    <!-- STEP 2: CATEGORY SELECTION FORM (ADMINS) -->
    <form id="categoryForm" class="space-y-6 hidden">
      <div class="bg-indigo-950/40 border border-indigo-800/50 p-4 rounded-xl flex items-center justify-between">
        <div>
          <span class="text-[10px] uppercase font-semibold text-slate-400 block tracking-wider">Authenticated As</span>
          <span id="authenticatedUserDisplay" class="font-bold text-indigo-300 text-xs">-</span>
        </div>
        <button type="button" id="logoutBtn" class="text-xs text-rose-400 hover:text-rose-300 font-semibold uppercase tracking-wider transition-colors">Log Out</button>
      </div>

      <div>
        <label for="initialWorkerType" class="block text-[11px] font-semibold text-slate-300 mb-2 uppercase tracking-wider">Worker Category</label>
        <select id="initialWorkerType" required class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white text-xs focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all">
          <option value="" disabled selected>-- Select Category --</option>
        </select>
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs uppercase tracking-wider py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30 active:scale-[0.99]">
        <span>Continue to Data Entry</span>
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>
    </form>
  </div>

  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIconSun = document.getElementById('themeIconSun');
    const themeIconMoon = document.getElementById('themeIconMoon');
    const themeModeText = document.getElementById('themeModeText');

    function applyTheme(theme) {
      if (theme === 'light') {
        document.documentElement.classList.add('light');
        themeIconSun.classList.remove('hidden');
        themeIconMoon.classList.add('hidden');
        themeModeText.textContent = 'Light';
      } else {
        document.documentElement.classList.remove('light');
        themeIconSun.classList.add('hidden');
        themeIconMoon.classList.remove('hidden');
        themeModeText.textContent = 'Dark';
      }
    }

    const savedTheme = localStorage.getItem('payrollTheme') || 'dark';
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = document.documentElement.classList.contains('light') ? 'dark' : 'light';
      localStorage.setItem('payrollTheme', currentTheme);
      applyTheme(currentTheme);
    });

    // UPDATED PASSCODES FOR CHRISTY AND AYU
    const PASSCODES = { "Christy": "098765", "Ayu": "563412", "Thusen": "281920" };
    
    // PERMISSIONS MATRIX
    const USER_CATEGORIES = {
      "Christy": ["Admin GPS", "Mekanik CCTV", "Finance GPS"],
      "Ayu": ["Admin HPZ", "Team comm", "Sales HPZ", "Gudang", "Driver", "Mekanik HPZ", "Mekanik GPS", "Helper", "Finance HPZ"]
    };

    const loginForm = document.getElementById('loginForm');
    const categoryForm = document.getElementById('categoryForm');
    const loginError = document.getElementById('loginError');
    const authenticatedUserDisplay = document.getElementById('authenticatedUserDisplay');
    const portalSubtext = document.getElementById('portalSubtext');
    const initialWorkerType = document.getElementById('initialWorkerType');
    
    let activeAuthenticatedUser = sessionStorage.getItem('activePayrollUser');

    function routeUser(user) {
      if (user === 'Thusen') {
        window.location.href = `payroll.html?user=Thusen`;
      } else {
        loginForm.classList.add('hidden');
        categoryForm.classList.remove('hidden');
        authenticatedUserDisplay.textContent = `${user} (Admin)`;
        portalSubtext.textContent = "Select worker category to start data entry.";

        // POPULATE PERMITTED CATEGORIES
        initialWorkerType.innerHTML = '<option value="" disabled selected>-- Select Category --</option>';
        const allowedCats = USER_CATEGORIES[user] || [];
        allowedCats.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = cat;
          initialWorkerType.appendChild(opt);
        });
      }
    }

    if (activeAuthenticatedUser) routeUser(activeAuthenticatedUser);

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const selectedUser = document.getElementById('loginUser').value;
      const enteredPasscode = document.getElementById('passcode').value;

      if (PASSCODES[selectedUser] && PASSCODES[selectedUser] === enteredPasscode) {
        activeAuthenticatedUser = selectedUser;
        sessionStorage.setItem('activePayrollUser', selectedUser);
        loginError.classList.add('hidden');
        routeUser(selectedUser);
      } else {
        loginError.classList.remove('hidden');
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('activePayrollUser');
      activeAuthenticatedUser = null;
      loginForm.classList.remove('hidden');
      categoryForm.classList.add('hidden');
      document.getElementById('passcode').value = '';
      portalSubtext.textContent = "Please authenticate to access the system.";
    });

    categoryForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const selectedType = initialWorkerType.value;
      if (selectedType && activeAuthenticatedUser) {
        window.location.href = `payroll.html?type=${encodeURIComponent(selectedType)}&user=${encodeURIComponent(activeAuthenticatedUser)}`;
      }
    });
  </script>
</body>
</html>
